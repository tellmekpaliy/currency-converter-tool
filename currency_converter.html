
Currency converter · HTML
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    :root {
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border: #d5d5d5;
      --radius: 8px;
    }
 
    @media (prefers-color-scheme: dark) {
      :root {
        --text-primary: #ffffff;
        --text-secondary: #999999;
        --border: #404040;
      }
    }
 
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: var(--text-primary);
      line-height: 1.6;
    }
 
    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
      }
    }
 
    .container {
      padding: 1.5rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
 
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
 
    .title-section h2 {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }
 
    .title-section p {
      font-size: 14px;
      color: var(--text-secondary);
    }
 
    .refresh-btn {
      padding: 10px 16px;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s;
    }
 
    .refresh-btn:hover {
      border-color: var(--text-primary);
    }
 
    .converters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
 
    .card {
      background: transparent;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
 
    .card-title {
      font-weight: 500;
      font-size: 16px;
      color: var(--text-primary);
    }
 
    .converter-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: flex-end;
    }
 
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
 
    .input-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }
 
    .converter-input {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-primary);
      transition: border-color 0.2s;
    }
 
    .converter-input:focus {
      outline: none;
      border-color: var(--text-primary);
    }
 
    .rate-display {
      text-align: center;
      color: var(--text-secondary);
      font-size: 11px;
      white-space: nowrap;
    }
 
    .footer {
      text-align: center;
      padding: 1rem;
      border-radius: 12px;
    }
 
    .footer p {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0;
    }
 
    .update-time {
      font-weight: 500;
    }
 
    @media (max-width: 1024px) {
      .converters {
        grid-template-columns: repeat(2, 1fr);
      }
    }
 
    @media (max-width: 640px) {
      .converters {
        grid-template-columns: 1fr;
      }
 
      .header {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-section">
        <h2>Конвертер валют</h2>
        <p>Актуальные курсы</p>
      </div>
      <button class="refresh-btn" onclick="location.reload()">
        Обновить
      </button>
    </div>
 
    <div class="converters" id="converters"></div>
 
    <div class="footer">
      <p>Обновлено: <span class="update-time" id="update-time">загрузка...</span></p>
    </div>
  </div>
 
  <script>
    const pairs = [
      { from: 'RUB', to: 'EUR', label: 'Рубль ↔ Евро' },
      { from: 'RUB', to: 'USD', label: 'Рубль ↔ Доллар' },
      { from: 'USD', to: 'EUR', label: 'Доллар ↔ Евро' },
      { from: 'RUB', to: 'CNY', label: 'Рубль ↔ Юань' },
      { from: 'USD', to: 'CNY', label: 'Доллар ↔ Юань' },
      { from: 'EUR', to: 'CNY', label: 'Евро ↔ Юань' }
    ];
 
    let rates = {};
 
    async function fetchRates() {
      try {
        const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const data = await response.json();
        
        rates.USD_EUR = data.rates.EUR;
        rates.USD_RUB = data.rates.RUB;
        rates.USD_CNY = data.rates.CNY;
        
        const eurResponse = await fetch('https://api.exchangerate-api.com/v4/latest/EUR');
        const eurData = await eurResponse.json();
        rates.EUR_CNY = eurData.rates.CNY;
        rates.EUR_RUB = eurData.rates.RUB;
        
        const rubResponse = await fetch('https://api.exchangerate-api.com/v4/latest/RUB');
        const rubData = await rubResponse.json();
        if (!rates.EUR_RUB) rates.EUR_RUB = rubData.rates.EUR;
        if (!rates.USD_RUB) rates.USD_RUB = rubData.rates.USD;
        
        document.getElementById('update-time').textContent = new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
      } catch (e) {
        console.log('Используются приблизительные курсы');
        rates = {
          'USD_EUR': 0.92,
          'USD_RUB': 105,
          'USD_CNY': 7.2,
          'EUR_RUB': 114,
          'EUR_CNY': 7.8,
          'RUB_CNY': 0.068
        };
        document.getElementById('update-time').textContent = 'примерные курсы';
      }
      renderConverters();
    }
 
    function getRate(from, to) {
      const key = `${from}_${to}`;
      const reverseKey = `${to}_${from}`;
      
      if (rates[key]) return rates[key];
      if (rates[reverseKey]) return 1 / rates[reverseKey];
      
      if (from === 'USD') return rates[`USD_${to}`] || 1;
      if (to === 'USD') return 1 / (rates[`USD_${from}`] || 1);
      
      const fromToUSD = 1 / (rates[`USD_${from}`] || 1);
      const USDtoTo = rates[`USD_${to}`] || 1;
      return fromToUSD * USDtoTo;
    }
 
    function renderConverters() {
      const container = document.getElementById('converters');
      container.innerHTML = '';
      
      pairs.forEach((pair, idx) => {
        const rate = getRate(pair.from, pair.to);
        
        const card = document.createElement('div');
        card.className = 'card';
        
        card.innerHTML = `
          <div class="card-title">${pair.label}</div>
          
          <div class="converter-row">
            <div class="input-group">
              <label class="input-label">${pair.from}</label>
              <input type="number" placeholder="0" id="from-${idx}" class="converter-input" oninput="convertFromTo(${idx})">
            </div>
            
            <div class="rate-display">
              <div>${rate.toFixed(4)}</div>
            </div>
            
            <div class="input-group">
              <label class="input-label">${pair.to}</label>
              <input type="number" placeholder="0" id="to-${idx}" class="converter-input" oninput="convertToFrom(${idx})">
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }
 
    function convertFromTo(idx) {
      const from = document.getElementById(`from-${idx}`);
      const to = document.getElementById(`to-${idx}`);
      const rate = getRate(pairs[idx].from, pairs[idx].to);
      
      if (from.value) {
        to.value = (parseFloat(from.value) * rate).toFixed(2);
      } else {
        to.value = '';
      }
    }
 
    function convertToFrom(idx) {
      const from = document.getElementById(`from-${idx}`);
      const to = document.getElementById(`to-${idx}`);
      const rate = getRate(pairs[idx].to, pairs[idx].from);
      
      if (to.value) {
        from.value = (parseFloat(to.value) * rate).toFixed(2);
      } else {
        from.value = '';
      }
    }
 
    fetchRates();
  </script>
</body>
</html>
