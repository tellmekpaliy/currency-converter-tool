<div style="max-width: 600px; margin: 0 auto; padding: 1rem 0;">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <h2 style="font-size: 20px; font-weight: 500; color: var(--text-primary); margin: 0 0 0.5rem;">Конвертер валют</h2>
    <p style="font-size: 13px; color: var(--text-secondary); margin: 0;">Актуальные курсы</p>
  </div>

  <div id="converters" style="display: flex; flex-direction: column; gap: 1rem;"></div>

  <div style="margin-top: 2rem; padding: 1rem; background: var(--surface-1); border-radius: 12px; border: 0.5px solid var(--border);">
    <p style="font-size: 12px; color: var(--text-secondary); margin: 0;">Курсы обновлены: <span id="update-time" style="font-weight: 500;">загрузка...</span></p>
    <button onclick="location.reload()" style="margin-top: 8px; padding: 8px 12px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 13px; cursor: pointer; color: var(--text-primary);">Обновить курсы</button>
  </div>
</div>

<script>
const pairs = [
  { from: 'RUB', to: 'EUR', label: 'Рубль ↔ Евро' },
  { from: 'RUB', to: 'USD', label: 'Рубль ↔ Доллар' },
  { from: 'USD', to: 'EUR', label: 'Доллар ↔ Евро' },
  { from: 'RUB', to: 'CNY', label: 'Рубль ↔ Юань' },
  { from: 'USD', to: 'CNY', label: 'Доллар ↔ Юань' },
  { from: 'EUR', to: 'CNY', label: 'Евро ↔ Юань' }
];

let rates = {};

async function fetchRates() {
  try {
    const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    const data = await response.json();
    
    rates.USD_EUR = data.rates.EUR;
    rates.USD_RUB = data.rates.RUB;
    rates.USD_CNY = data.rates.CNY;
    
    const eurResponse = await fetch('https://api.exchangerate-api.com/v4/latest/EUR');
    const eurData = eurResponse.json();
    eurData.then(d => {
      rates.EUR_CNY = d.rates.CNY;
      rates.EUR_RUB = d.rates.RUB;
    });
    
    const rubResponse = await fetch('https://api.exchangerate-api.com/v4/latest/RUB');
    const rubData = rubResponse.json();
    rubData.then(d => {
      if (!rates.EUR_RUB) rates.EUR_RUB = d.rates.EUR;
      if (!rates.USD_RUB) rates.USD_RUB = d.rates.USD;
    });
    
    document.getElementById('update-time').textContent = new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
  } catch (e) {
    console.log('Используются приблизительные курсы');
    rates = {
      'USD_EUR': 0.92,
      'USD_RUB': 105,
      'USD_CNY': 7.2,
      'EUR_RUB': 114,
      'EUR_CNY': 7.8,
      'RUB_CNY': 0.068
    };
    document.getElementById('update-time').textContent = 'примерные курсы';
  }
  renderConverters();
}

function getRate(from, to) {
  const key = `${from}_${to}`;
  const reverseKey = `${to}_${from}`;
  
  if (rates[key]) return rates[key];
  if (rates[reverseKey]) return 1 / rates[reverseKey];
  
  // Вычисляем через USD
  if (from === 'USD') return rates[`USD_${to}`] || 1;
  if (to === 'USD') return 1 / (rates[`USD_${from}`] || 1);
  
  const fromToUSD = 1 / (rates[`USD_${from}`] || 1);
  const USDtoTo = rates[`USD_${to}`] || 1;
  return fromToUSD * USDtoTo;
}

function renderConverters() {
  const container = document.getElementById('converters');
  container.innerHTML = '';
  
  pairs.forEach((pair, idx) => {
    const rate = getRate(pair.from, pair.to);
    const reverseRate = getRate(pair.to, pair.from);
    
    const card = document.createElement('div');
    card.style.cssText = 'background: var(--surface-2); border-radius: 12px; border: 0.5px solid var(--border); padding: 1.25rem;';
    
    card.innerHTML = `
      <div style="font-weight: 500; font-size: 15px; color: var(--text-primary); margin-bottom: 1rem;">${pair.label}</div>
      
      <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: flex-end;">
        <div>
          <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">${pair.from}</label>
          <input type="number" placeholder="0" id="from-${idx}" 
            style="width: 100%; padding: 10px 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 14px; color: var(--text-primary); box-sizing: border-box;" 
            oninput="convertFromTo(${idx})">
        </div>
        
        <div style="text-align: center; color: var(--text-secondary); font-size: 12px; font-weight: 500;">
          <div style="margin-bottom: 4px;">⇄</div>
          <div style="font-size: 11px;">${rate.toFixed(4)}</div>
        </div>
        
        <div>
          <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">${pair.to}</label>
          <input type="number" placeholder="0" id="to-${idx}" 
            style="width: 100%; padding: 10px 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 14px; color: var(--text-primary); box-sizing: border-box;" 
            oninput="convertToFrom(${idx})">
        </div>
      </div>
    `;
    
    container.appendChild(card);
  });
}

function convertFromTo(idx) {
  const from = document.getElementById(`from-${idx}`);
  const to = document.getElementById(`to-${idx}`);
  const rate = getRate(pairs[idx].from, pairs[idx].to);
  
  if (from.value) {
    to.value = (parseFloat(from.value) * rate).toFixed(2);
  } else {
    to.value = '';
  }
}

function convertToFrom(idx) {
  const from = document.getElementById(`from-${idx}`);
  const to = document.getElementById(`to-${idx}`);
  const rate = getRate(pairs[idx].to, pairs[idx].from);
  
  if (to.value) {
    from.value = (parseFloat(to.value) * rate).toFixed(2);
  } else {
    from.value = '';
  }
}

fetchRates();
</script>
